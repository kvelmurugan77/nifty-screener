# =====================================================================
# Daily Email Scanner - sends the pick of the day every trading morning
#
# TARGET: email in the inbox by ~08:30 IST, Mon-Fri, before the 09:15 open.
#
# HOW DELIVERY WORKS (and why it kept arriving at 12:30 IST)
# GitHub Actions cron is "best effort": runs are queued and can be delayed by
# tens of minutes to hours, worst at the top of the hour. This repo was firing
# a 08:30 IST trigger and the email landed at 12:39 IST on 2026-11-03.
#
# Therefore two independent paths:
#   1. EXTERNAL TRIGGER (reliable, primary): Google Apps Script posts to
#      workflow_dispatch at 08:20 IST Mon-Fri. See apps_script_trigger.gs.
#      This was working until 2026-10-02 and then silently stopped - almost
#      certainly because the GitHub token inside the script was revoked.
#   2. IN-REPO CRON (fallback): five off-peak triggers from 08:17 to 10:17 IST.
#      The .sent_marker cache (actions/cache, keyed by UTC date) makes the job
#      idempotent - the first trigger that fires sends, the rest no-op in ~20s.
#
# The plan is always built on the previous session's settled data (the market
# is closed before 09:15), so a late run is not dangerous, just useless for an
# opening-bell trade. Tune the fallbacks if your inbox time matters more than
# the exact data cut.
#
# Credentials come from repository secrets (GMAIL_USER / GMAIL_APP_PASSWORD /
# TO_EMAIL) with settings.json as a fallback.
# =====================================================================

name: Daily Email Scanner

on:
  schedule:
    # GitHub's scheduler fires scheduled jobs LATE and the delay is worst on
    # the hour / half hour, when everyone else's cron is queued (measured on
    # this repo: a 08:30 IST trigger sent the email at 12:39 IST). So:
    #   * every trigger sits on an off-peak minute (07/13/17/43/47),
    #   * the first one is deliberately EARLY (08:17 IST) so a normal
    #     10-20 minute delay lands right around the 08:30 target,
    #   * the rest are fallbacks, and the .sent_marker cache makes whichever
    #     one fires first the only one that sends.
    # The real fix for on-time delivery is the EXTERNAL trigger
    # (Google Apps Script / cron-job.org) hitting workflow_dispatch at
    # 08:20 IST Mon-Fri - see apps_script_trigger.gs.
    - cron: '47 2 * * 1-5'   # 08:17 IST  <- primary
    - cron: '13 3 * * 1-5'   # 08:43 IST  <- fallback 1
    - cron: '43 3 * * 1-5'   # 09:13 IST  <- fallback 2 (2 min before open)
    - cron: '17 4 * * 1-5'   # 09:47 IST  <- late fallback (live-data banner)
    - cron: '47 4 * * 1-5'   # 10:17 IST  <- last chance
  workflow_dispatch:         # manual test button + the external 08:20 IST trigger

concurrency:
  group: daily-email-scanner
  cancel-in-progress: false   # never cancel a run that may have already sent

jobs:
  scan-and-email:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write    # so we can commit picks_history.json back (cooldown memory)
    env:
      # Gmail credentials from GitHub Secrets (safer than the public settings.json;
      # daily_email.py falls back to settings.json if a secret is not set yet)
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      TO_EMAIL: ${{ secrets.TO_EMAIL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute date stamp (UTC) + log IST clock time
        id: stamp
        run: |
          echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          echo "IST now: $(TZ=Asia/Kolkata date '+%F %H:%M:%S')  (event: ${{ github.event_name }})"

      - name: Restore sent-marker (prevents duplicate emails)
        uses: actions/cache/restore@v4
        with:
          path: .sent_marker
          key: sent-${{ steps.stamp.outputs.day }}

      - name: Early exit if email already sent today
        id: earlyskip
        run: |
          if [ -f .sent_marker ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "sent-marker found — a previous trigger already sent today; skipping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.earlyskip.outputs.skip == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.earlyskip.outputs.skip == 'false'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scanner and email pick of the day
        if: steps.earlyskip.outputs.skip == 'false'
        run: python daily_email.py

      - name: Commit pick history (cooldown memory)
        if: steps.earlyskip.outputs.skip == 'false' && always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add picks_history.json
          if git diff --cached --quiet; then
            echo "no change to pick history"
          else
            git commit -m "Update pick history (cooldown)"
            git push origin HEAD
          fi

      - name: Save sent-marker
        if: steps.earlyskip.outputs.skip == 'false' && always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .sent_marker
          key: sent-${{ steps.stamp.outputs.day }}
