# =====================================================================
# Daily Email Scanner - sends the pick of the day every trading morning
# 03:50 UTC = 09:20 IST (IST is UTC+5:30)
# Runs Mon-Fri only (NSE is closed on weekends)
# Credentials come from settings.json in this repo (private).
# =====================================================================

name: Daily Email Scanner

on:
  schedule:
    - cron: '50 3 * * 1-5'   # 09:20 AM IST, Mon-Fri
  workflow_dispatch:         # lets you click "Run workflow" to test manually

concurrency:
  group: daily-email-scanner
  cancel-in-progress: true

jobs:
  scan-and-email:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scanner and email pick of the day
        run: python daily_email.py
