# =====================================================================
# Daily Email Scanner - sends the pick of the day every trading morning
#
# TARGET: email in the inbox by ~08:30 IST (market opens 09:15).
#
# THE PROBLEM THIS FILE SOLVES
# GitHub Actions cron is "best effort" and on THIS repository it is far
# worse than that: measured over 340 delivered scheduled runs, the median
# delay between the cron time and the actual run is 6.8 HOURS. A 08:17 IST
# cron delivered the email at 15:33 / 16:33 / 17:44 IST. That is why the
# "morning" email kept arriving in the afternoon.
#
# THE FIX: TIME-GATED SENDING
# We no longer expect GitHub to wake us at 08:30. Instead we schedule a
# ladder of crons through the small hours and let the JOB decide whether it
# is allowed to send:
#   * a run that wakes up before 07:45 IST exits immediately (no email),
#   * the first run that wakes up between 07:45 and 09:20 IST sends,
#   * runs after 09:20 still send, but the email is flagged LATE so the
#     numbers are never mistaken for a pre-open plan.
# Because the delay is 5-8 hours, the small-hours crons are the ones that
# land in the 07:45-09:20 window.
#
#   IST     -> UTC cron            purpose
#   23:30      0 18 * * 1-5        +7h delay -> ~06:30 (too early, exits)
#   00:15     45 18 * * 1-5        +7h       -> ~07:15 (usually exits)
#   01:00     30 19 * * 1-5        +7h       -> ~08:00  <- main sender
#   01:45     15 20 * * 1-5        +7h       -> ~08:45  <- main sender
#   02:30      0 21 * * 1-5        +7h       -> ~09:30 (late fallback)
#   08:17     47 2 * * 1-5         +7h       -> ~15:00 (LATE fallback)
#   09:47     17 4 * * 1-5         +7h       -> ~16:30 (LATE fallback)
#
# A .sent_marker cache (keyed by the IST date) makes the job idempotent:
# the first run allowed to send does so, every later run no-ops in ~20s.
#
# For a guaranteed on-the-dot 08:30 you still want an external trigger
# (Google Apps Script / cron-job.org) hitting workflow_dispatch at 08:20 IST -
# see apps_script_trigger.gs. workflow_dispatch always bypasses the time gate.
#
# Credentials: repository secrets GMAIL_USER / GMAIL_APP_PASSWORD / TO_EMAIL,
# with settings.json as a fallback.
# =====================================================================

name: Daily Email Scanner

on:
  schedule:
    - cron: '0 18 * * 1-5'    # 23:30 IST
    - cron: '45 18 * * 1-5'   # 00:15 IST
    - cron: '30 19 * * 1-5'   # 01:00 IST  <- main sender
    - cron: '15 20 * * 1-5'   # 01:45 IST  <- main sender
    - cron: '0 21 * * 1-5'    # 02:30 IST
    - cron: '47 2 * * 1-5'    # 08:17 IST  (late fallback)
    - cron: '17 4 * * 1-5'    # 09:47 IST  (late fallback)
  workflow_dispatch:          # manual button + external 08:20 IST trigger

concurrency:
  group: daily-email-scanner
  cancel-in-progress: false   # never cancel a run that may have already sent

jobs:
  scan-and-email:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write    # so we can commit picks_history.json back (cooldown memory)
    env:
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      TO_EMAIL: ${{ secrets.TO_EMAIL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Date stamp (IST) + log clock
        id: stamp
        run: |
          echo "day=$(TZ=Asia/Kolkata date +%F)" >> "$GITHUB_OUTPUT"
          echo "IST now: $(TZ=Asia/Kolkata date '+%F %H:%M:%S')  (event: ${{ github.event_name }})"

      - name: Restore sent-marker (prevents duplicate emails)
        uses: actions/cache/restore@v4
        with:
          path: .sent_marker
          key: sent-${{ steps.stamp.outputs.day }}

      - name: Early exit if email already sent today
        id: earlyskip
        run: |
          if [ -f .sent_marker ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "sent-marker found — a previous run already sent today's email; skipping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Time gate (schedule runs only)
        id: gate
        run: |
          # workflow_dispatch (manual test / external trigger) always sends.
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "manual dispatch — time gate bypassed"
            exit 0
          fi
          DOW=$(TZ=Asia/Kolkata date +%u)      # 1=Mon .. 7=Sun
          MINS=$(( $(TZ=Asia/Kolkata date +%H) * 60 + $(TZ=Asia/Kolkata date +%M) ))
          OPEN_AT=$(( 7 * 60 + 45 ))           # 07:45 IST - do not send earlier
          if [ "$DOW" -gt 5 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "weekend in IST — nothing to send"
          elif [ "$MINS" -lt "$OPEN_AT" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "woke up at $(TZ=Asia/Kolkata date +%H:%M) IST — earlier than 07:45, waiting for a later trigger"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "woke up at $(TZ=Asia/Kolkata date +%H:%M) IST — allowed to send"
          fi

      - name: Set up Python
        if: steps.earlyskip.outputs.skip == 'false' && steps.gate.outputs.skip == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.earlyskip.outputs.skip == 'false' && steps.gate.outputs.skip == 'false'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scanner and email pick of the day
        if: steps.earlyskip.outputs.skip == 'false' && steps.gate.outputs.skip == 'false'
        run: python daily_email.py

      - name: Commit pick history (cooldown memory)
        if: steps.earlyskip.outputs.skip == 'false' && steps.gate.outputs.skip == 'false' && always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add picks_history.json
          if git diff --cached --quiet; then
            echo "no change to pick history"
          else
            git commit -m "Update pick history (cooldown)"
            git push origin HEAD
          fi

      - name: Save sent-marker
        if: steps.earlyskip.outputs.skip == 'false' && steps.gate.outputs.skip == 'false' && always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .sent_marker
          key: sent-${{ steps.stamp.outputs.day }}
