# =====================================================================
# Daily Email Scanner — sends the pick of the day at ~08:25 IST (NSE opens 09:15)
#
# WHY THIS FILE LOOKS LIKE THIS
# GitHub Actions cron on this repository is delivered very late. Measured on
# 340 delivered runs of this workflow: median delay between the cron time and
# the actual run = 6.8 HOURS (a 08:17 IST cron sent the email at 15:33, 16:33,
# 17:44 IST). Anything that depends on GitHub waking us up at a fixed hour is
# therefore useless for a pre-open email.
#
# THE TRICK: WAKE EARLY, WAIT, SEND ON TIME
# We schedule crons through the night. Whatever time a run actually wakes up,
# the job sleeps until 08:25 IST and only then builds and sends the email.
#   * woke before 08:25  -> sleep until 08:25, then send (exact timing)
#   * woke 08:25-09:20  -> send immediately
#   * woke after 09:20  -> still send, but the email is flagged [LATE]
#   * woke before 02:55  -> exit without sending; a later cron will catch it
#                           (we never hold a runner for more than ~5.5 hours)
#
# The cron ladder runs 23:30 -> 09:47 IST, one trigger per hour, so that no
# matter how late (or early) GitHub delivers them, at least one run lands in a
# position to hold until 08:25. Runs that arrive before 02:55 exit immediately
# (the sleep cap is 5h30m), runs after 09:20 send a [LATE]-flagged email.
#
# A .sent_marker cache keyed by the IST date keeps it idempotent: the first run
# that is allowed to send does so; every later run no-ops in ~20 seconds.
# `workflow_dispatch` (manual button or an external trigger) bypasses the wait
# entirely and sends immediately.
#
# Credentials: repo secrets GMAIL_USER / GMAIL_APP_PASSWORD / TO_EMAIL,
# with settings.json as the fallback.
# =====================================================================

name: Daily Email Scanner

on:
  schedule:
    # Ladder of crons through the night and morning (IST). Whatever one of
    # these GitHub actually delivers, the job either sleeps to 08:25 IST or
    # sends immediately if it is already past that.
    - cron: '0 18 * * 1-5'    # 23:30 IST
    - cron: '0 19 * * 1-5'    # 00:30 IST
    - cron: '0 20 * * 1-5'    # 01:30 IST
    - cron: '0 21 * * 1-5'    # 02:30 IST  (too early to hold -> exits)
    - cron: '0 22 * * 1-5'    # 03:30 IST  (first one that can hold to 08:25)
    - cron: '0 23 * * 1-5'    # 04:30 IST
    - cron: '0 0 * * 1-5'     # 05:30 IST
    - cron: '0 1 * * 1-5'     # 06:30 IST
    - cron: '0 2 * * 1-5'     # 07:30 IST
    - cron: '47 2 * * 1-5'    # 08:17 IST
    - cron: '17 4 * * 1-5'    # 09:47 IST  (last resort, arrives as [LATE])
  workflow_dispatch:          # manual test button + external 08:20 IST trigger

concurrency:
  group: daily-email-scanner
  cancel-in-progress: false   # never cancel a run that may have already sent

jobs:
  scan-and-email:
    runs-on: ubuntu-latest
    timeout-minutes: 380        # must exceed the maximum wait (~5.5 h) + job time
    permissions:
      contents: write           # to commit picks_history.json back (cooldown memory)
    env:
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      TO_EMAIL: ${{ secrets.TO_EMAIL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Date stamp (IST) + log clock
        id: stamp
        run: |
          echo "day=$(TZ=Asia/Kolkata date +%F)" >> "$GITHUB_OUTPUT"
          echo "IST now: $(TZ=Asia/Kolkata date '+%F %H:%M:%S')  (event: ${{ github.event_name }})"

      - name: Restore sent-marker (prevents duplicate emails)
        uses: actions/cache/restore@v4
        with:
          path: .sent_marker
          key: sent-${{ steps.stamp.outputs.day }}

      - name: Early exit if email already sent today
        id: earlyskip
        run: |
          if [ -f .sent_marker ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "sent-marker found — a previous run already sent today's email; skipping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait until 08:25 IST (schedule runs only)
        id: wait
        if: steps.earlyskip.outputs.skip == 'false'
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "manual dispatch — sending immediately, no wait"
            exit 0
          fi
          DOW=$(TZ=Asia/Kolkata date +%u)                 # 1=Mon .. 7=Sun
          if [ "$DOW" -gt 5 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "weekend in IST — nothing to send"
            exit 0
          fi
          NOW=$(date +%s)
          TARGET=$(TZ=Asia/Kolkata date -d 'today 08:25' +%s)
          WAIT=$(( TARGET - NOW ))
          echo "woke at $(TZ=Asia/Kolkata date +%H:%M) IST, target 08:25 IST, wait=${WAIT}s"
          if [ "$WAIT" -le 0 ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "already past 08:25 — sending now"
          elif [ "$WAIT" -le 19800 ]; then                  # <= 5h30m: safe to hold
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "sleeping ${WAIT}s until 08:25 IST ..."
            sleep "$WAIT"
            echo "awake at $(TZ=Asia/Kolkata date +%H:%M:%S) IST"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "too early to hold (${WAIT}s) — exiting; a later cron will send"
          fi

      - name: Set up Python
        if: steps.earlyskip.outputs.skip == 'false' && steps.wait.outputs.skip == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.earlyskip.outputs.skip == 'false' && steps.wait.outputs.skip == 'false'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scanner and email pick of the day
        if: steps.earlyskip.outputs.skip == 'false' && steps.wait.outputs.skip == 'false'
        run: python daily_email.py

      - name: Commit pick history (cooldown memory)
        if: steps.earlyskip.outputs.skip == 'false' && steps.wait.outputs.skip == 'false' && always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add picks_history.json
          if git diff --cached --quiet; then
            echo "no change to pick history"
          else
            git commit -m "Update pick history (cooldown)"
            git push origin HEAD
          fi

      - name: Save sent-marker
        if: steps.earlyskip.outputs.skip == 'false' && steps.wait.outputs.skip == 'false' && always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .sent_marker
          key: sent-${{ steps.stamp.outputs.day }}
