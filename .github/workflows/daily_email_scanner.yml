# =====================================================================
# Daily Email Scanner - sends the pick of the day every trading morning
#
# WHY TWO SCHEDULED TIMES?
# GitHub Actions runs scheduled jobs on a "best-effort" basis and can
# fire them LATE (we measured ~1h50m of delay on this repo). To arrive
# on time we schedule EARLY and add a FALLBACK that never double-sends:
#
#   Primary : 01:40 UTC = 07:10 IST  (arrives ~08:30-09:00 IST after
#             GitHub's typical delay, well before the 09:15 open)
#   Fallback: 03:15 UTC = 08:45 IST  (only sends if the primary failed;
#             a ".sent_marker" file cached per day prevents duplicates)
#
# Either way the plan is built on the previous day's FINAL settled data
# (market is closed before 09:15), so no opening-spike contamination.
# Runs Mon-Fri only (NSE closed on weekends).
# Credentials come from settings.json in this repo (private).
# =====================================================================

name: Daily Email Scanner

on:
  schedule:
    - cron: '40 1 * * 1-5'   # 07:10 IST (primary)
    - cron: '15 3 * * 1-5'   # 08:45 IST (fallback, idempotent)
  workflow_dispatch:         # manual test button

concurrency:
  group: daily-email-scanner
  cancel-in-progress: false   # never cancel a run that may have already sent

jobs:
  scan-and-email:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write    # so we can commit picks_history.json back (cooldown memory)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute date stamp (UTC)
        id: stamp
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore sent-marker (prevents duplicate emails)
        uses: actions/cache/restore@v4
        with:
          path: .sent_marker
          key: sent-${{ steps.stamp.outputs.day }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scanner and email pick of the day
        run: python daily_email.py

      - name: Commit pick history (cooldown memory)
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add picks_history.json
          if git diff --cached --quiet; then
            echo "no change to pick history"
          else
            git commit -m "Update pick history (cooldown)"
            git push origin HEAD
          fi

      - name: Save sent-marker
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .sent_marker
          key: sent-${{ steps.stamp.outputs.day }}
