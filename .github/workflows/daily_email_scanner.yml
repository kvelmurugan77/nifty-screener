# =====================================================================
# Daily Email Scanner - sends the pick of the day every trading morning
# 03:15 UTC = 08:45 IST (IST is UTC+5:30)
# Runs BEFORE the market opens (9:15) so the plan is built only on the
# previous day's FINAL settled data - no opening-spike contamination.
# Runs Mon-Fri only (NSE is closed on weekends).
# Credentials come from settings.json in this repo (private).
# =====================================================================

name: Daily Email Scanner

on:
  schedule:
    - cron: '15 3 * * 1-5'   # 08:45 AM IST, Mon-Fri (before market open)
  workflow_dispatch:         # lets you click "Run workflow" to test manually

concurrency:
  group: daily-email-scanner
  cancel-in-progress: true

jobs:
  scan-and-email:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scanner and email pick of the day
        run: python daily_email.py
