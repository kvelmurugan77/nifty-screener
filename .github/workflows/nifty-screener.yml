# =====================================================================
# Nifty 50 Screener - Reduced Schedule (every 30 min, not 15)
# =====================================================================

name: Nifty 50 Screener

on:
  schedule:
    - cron: '30 3 * * 1-5'
    - cron: '45 3 * * 1-5'
    - cron: '15 4 * * 1-5'
    - cron: '45 4 * * 1-5'
    - cron: '15 5 * * 1-5'
    - cron: '45 5 * * 1-5'
    - cron: '15 6 * * 1-5'
    - cron: '45 6 * * 1-5'
    - cron: '15 7 * * 1-5'
    - cron: '45 7 * * 1-5'
    - cron: '15 8 * * 1-5'
    - cron: '45 8 * * 1-5'
    - cron: '15 9 * * 1-5'
    - cron: '45 9 * * 1-5'
  workflow_dispatch:

concurrency:
  group: nifty-screener
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Restore rally scanner state
        uses: actions/cache/restore@v4
        with:
          path: .alert_state
          key: rally-state-
          restore-keys: |
            rally-state-

      - name: Run appropriate script based on UTC time
        run: |
          UTC_HOUR=$(date -u +"%H")
          UTC_MIN=$(date -u +"%M")
          UTC_TIME="${UTC_HOUR}${UTC_MIN}"
          echo "Current UTC time: ${UTC_HOUR}:${UTC_MIN}"
          if [ "$UTC_TIME" = "0330" ]; then
            echo "Running MORNING BRIEFING..."
            python nifty_morning_briefing.py
          else
            echo "Running RALLY SCANNER..."
            python nifty_rally_scanner.py
          fi

      - name: Save rally scanner state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .alert_state
          key: rally-state-${{ github.run_id }}
